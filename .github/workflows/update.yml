name: Uppdatera data och publicera

on:
  schedule:
    - cron: "20 14 * * *"      # varje dag ca 16:20 svensk tid, efter att morgondagens priser publicerats
  workflow_dispatch:            # kan startas manuellt under Actions
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "update_data.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hämta ENTSO-E-data och räkna
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python update_data.py

      - name: Spara cache och beräknad data i repot
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || (git commit -m "Uppdatera data $(date -u +%F)" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
